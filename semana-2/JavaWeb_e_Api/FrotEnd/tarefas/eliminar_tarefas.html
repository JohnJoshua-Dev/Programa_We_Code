<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Eliminar Tarefas</title>
<link rel="stylesheet" type="text/css" href="../css/style.css">

<style>
    body {
        font-family: Arial, sans-serif;
        background:#e8e8e8;
        display:flex;
        justify-content:center;
        padding-top:50px;
    }

    .container {
        width:350px;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    h2 {
        text-align:center;
        margin:0;
    }

    ul {
        margin-top:20px;
        padding:0;
    }

    li {
        list-style:none;
        background:#f3f3f3;
        padding:12px;
        margin-top:8px;
        border-radius:5px;
        display:flex;
        align-items:center;
        gap:10px;
        position:relative;
    }

    .delete-label {
        margin-left:auto;
        background:red;
        color:white;
        padding:5px 10px;
        border-radius:5px;
        cursor:pointer;
        font-size:14px;
        font-weight:bold;
    }

    /* Esconder checkbox */
    input[type="checkbox"] {
        display:none;
    }

    /* Quando checkbox estiver marcado, esconde a tarefa */
    input[type="checkbox"]:checked ~ span {
        display:none;
    }
    input[type="checkbox"]:checked ~ .delete-label {
        display:none;
    }

    /* Botão Voltar à Home */
    .btn-home {
        display:block;
        width:200px;
        margin:25px auto 0;
        padding:12px;
        text-align:center;
        background:#008000;
        color:white;
        font-size:16px;
        font-weight:bold;
        border-radius:8px;
        text-decoration:none;
        transition:0.3s;
    }

    .btn-home:hover {
        background:#006600;
    }

</style>
</head>
<body>
   <section class="main-content">
<div class="container joshua">
    <h2>Minhas Tarefas</h2>

    <ul>
        <li>
            <input type="checkbox" id="t1">
            <span>Estudar HTML</span>
            <label class="delete-label" for="t1">Eliminar</label>
        </li>

        <li>
            <input type="checkbox" id="t2">
            <span>Limpar quarto</span>
            <label class="delete-label" for="t2">Eliminar</label>
        </li>

        <li>
            <input type="checkbox" id="t3">
            <span>Fazer exercícios</span>
            <label class="delete-label" for="t3">Eliminar</label>
        </li>
    </ul>

    <!-- Botão para voltar à home -->
    <a href="../index.html" class="btn-home">Voltar à Home</a>

</div>
</section>

</body>
</html>
