<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tarefas</title>
<link rel="stylesheet" type="text/css" href="../css/style.css">
<style>
    body {
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        padding: 20px;
        display:flex;
        justify-content:center;
    }

    .container {
        max-width: 400px;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        margin-top:50px;
    }

    h2 {
        text-align:center;
        margin-bottom: 20px;
    }

    ul {
        margin-top: 20px;
        padding: 0;
    }

    li {
        list-style: none;
        background: #eee;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
    }

    /* Botão Home */
    .btn-home {
        display:block;
        width:150px;
        margin: 20px auto 0 auto;
        padding:12px;
        text-align:center;
        background:#007bff;
        color:white;
        border-radius:8px;
        font-weight:bold;
        text-decoration:none;
        transition:0.3s;
    }

    .btn-home:hover {
        background:#0056b3;
    }
</style>
</head>
<body>
<section class="main-content">
<div class="container joshua">
    <h2>Minhas Tarefas</h2>

    <ul>
        <li>Estudar HTML</li>
        <li>Fazer trabalho de escola</li>
        <li>Limpar quarto</li>
        <li>Organizar materiais</li>
        <li>Treinar esportes</li>
    </ul>

    <!-- Botão Home -->
    <a href="../index.html" class="btn-home">Home</a>
</div>
</section>

</body>
</html>
