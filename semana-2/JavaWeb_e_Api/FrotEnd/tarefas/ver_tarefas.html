<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Lista de Tarefas</title>
<link rel="stylesheet" type="text/css" href="../css/style.css">

<style>
    body {
        font-family: Arial, sans-serif;
        background:#e8e8e8;
        display:flex;
        justify-content:center;
        padding-top:50px;
    }

    .container {
        width:350px;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
        text-align:center;
        margin:0;
    }

    ul {
        margin-top:20px;
        padding:0;
    }

    li {
        list-style:none;
        background:#f3f3f3;
        padding:12px;
        margin-top:8px;
        border-radius:5px;
    }

    /* Botão Home */
    .btn-home {
        display:block;
        margin:20px auto 0 auto;
        width:120px;
        text-align:center;
        background:#007bff;
        color:white;
        padding:10px;
        border-radius:8px;
        font-weight:bold;
        text-decoration:none;
        transition:0.3s;
    }

    .btn-home:hover {
        background:#0056b3;
    }
</style>
</head>
<body >
<section class="main-content">
<div class="container joshua">
    <h2>Minhas Tarefas</h2>

    <ul>
        <li>Estudar HTML</li>
        <li>Fazer trabalho de escola</li>
        <li>Limpar quarto</li>
        <li>Organizar materiais</li>
        <li>Treinar esportes</li>
    </ul>

    <!-- Botão Home -->
    <a href="../index.html" class="btn-home">Home</a>
</div>
</section>
</body>
</html>
